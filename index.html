<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Outreach Studio — Événements & Initiatives</title>
  
  <!-- Dyslexia-Friendly & Legible Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.8);
      --card-border: rgba(56, 189, 248, 0.25);
      --pos-coral: #f97316;
      --pos-peach: #ff8a65;
      --cdl-cyan: #38bdf8;
      --cdl-purple: #a855f7;
      --choir-gold: #fbbf24;
      --choir-magenta: #d946ef;
      --neon-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(249, 115, 22, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    /* Navigation Bar */
    .global-nav {
      position: sticky; top: 0; z-index: 999;
      background: rgba(11, 15, 25, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border); padding: 12px 20px;
    }

    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    .pos-logo-link {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.95); border: 2px solid var(--pos-coral);
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.45); overflow: hidden;
      transition: transform 0.3s ease; flex-shrink: 0;
    }
    .pos-logo-link:hover { transform: scale(1.08); }
    .pos-logo-img { width: 32px; height: 32px; object-fit: contain; }

    .nav-menu { display: flex; align-items: center; gap: 8px; position: relative; }

    .nav-tab {
      color: var(--text-muted); text-decoration: none; font-weight: 700;
      font-size: 13.5px; padding: 6px 12px; border-radius: 20px;
      white-space: nowrap; border: 1px solid transparent; transition: all 0.25s ease;
    }
    .nav-tab:hover { color: var(--text-main); border-color: rgba(56, 189, 248, 0.3); background: rgba(255, 255, 255, 0.04); }
    .nav-tab.active { color: #000; background: var(--cdl-cyan); box-shadow: 0 0 12px var(--cdl-cyan); }

    /* Nav Dropdown for >3 Initiatives */
    .nav-dropdown { position: relative; display: inline-block; }
    .nav-dropdown-content {
      display: none; position: absolute; top: 100%; left: 0;
      background: #0f172a; border: 1px solid var(--card-border); border-radius: 12px;
      min-width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; padding: 8px 0;
    }
    .nav-dropdown:hover .nav-dropdown-content { display: block; }
    .nav-dropdown-item {
      display: block; padding: 8px 16px; color: var(--text-muted);
      text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.2s;
    }
    .nav-dropdown-item:hover { background: rgba(56, 189, 248, 0.15); color: var(--cdl-cyan); }

    .right-controls { display: flex; align-items: center; gap: 8px; }

    .join-btn {
      background: linear-gradient(135deg, var(--neon-amber), #f97316); color: #000000;
      font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 20px;
      text-decoration: none; white-space: nowrap; box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
      transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 5px;
    }
    .join-btn:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(245, 158, 11, 0.7); color: #000000; }

    .lock-btn {
      background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5;
      padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 12.5px;
      cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.3s ease;
    }
    .lock-btn.unlocked { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #86efac; box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }

    .undo-global-btn {
      display: none; background: rgba(56, 189, 248, 0.2); border: 1px solid var(--cdl-cyan);
      color: var(--cdl-cyan); padding: 5px 12px; border-radius: 20px; font-weight: 700;
      font-size: 12.5px; cursor: pointer; transition: all 0.2s ease;
    }

    .lang-toggle { display: flex; background: rgba(255, 255, 255, 0.08); padding: 3px; border-radius: 30px; border: 1px solid var(--card-border); flex-shrink: 0; }
    .lang-btn { background: transparent; border: none; color: var(--text-muted); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
    .lang-btn.active { background: var(--cdl-cyan); color: #000; }

    /* Pencil Edit Buttons */
    .edit-pencil {
      display: none; background: var(--neon-amber); color: #000; border: none;
      border-radius: 50%; width: 26px; height: 26px; font-size: 12px; font-weight: 700;
      cursor: pointer; margin-left: 8px; vertical-align: middle; text-align: center;
      line-height: 26px; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); transition: transform 0.2s ease;
    }
    .edit-pencil:hover { transform: scale(1.15); }
    body.body-unlocked .edit-pencil { display: inline-block; }

    /* Layout Container & Buffer Margins */
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

    .glass-card {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 16px; padding: 26px;
      margin-bottom: 28px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .hero-header { display: flex; align-items: center; gap: 22px; }
    .logo-container-relative { position: relative; display: inline-block; flex-shrink: 0; }
    .hub-logo-img {
      width: 90px; height: 90px; border-radius: 50%; object-fit: contain;
      background: #ffffff; padding: 10px; border: 3px solid var(--pos-coral);
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.45);
    }

    .title-area h1 {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, #ff6b6b 0%, #fca5a5 40%, var(--cdl-cyan) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(249, 115, 22, 0.3));
    }

    .section-title {
      font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--cdl-cyan);
      display: flex; align-items: center; justify-content: space-between;
    }

    .events-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }

    .notion-event-card {
      background: rgba(15, 23, 42, 0.85); border: 1px solid var(--card-border);
      border-radius: 14px; overflow: hidden; color: var(--text-main);
      display: flex; flex-direction: column; cursor: pointer; transition: all 0.35s ease; position: relative;
    }
    .notion-event-card:hover { transform: translateY(-5px); border-color: var(--cdl-cyan); }
    .card-cover { height: 140px; width: 100%; overflow: hidden; background: rgba(15, 23, 42, 0.9); display: flex; align-items: center; justify-content: center; }
    .card-cover-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .notion-event-card:hover .card-cover-img { transform: scale(1.05); }
    .card-body { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; align-self: flex-start; margin-bottom: 8px; background: rgba(56, 189, 248, 0.15); color: var(--cdl-cyan); }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .card-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }

    /* Rules Dropdowns */
    .rule-dropdown { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .rule-dropdown summary { padding: 14px 18px; font-weight: 700; color: var(--cdl-cyan); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    .rule-dropdown summary::-webkit-details-marker { display: none; }
    .rule-dropdown summary::after { content: "▼"; font-size: 12px; transition: transform 0.2s ease; margin-left: 10px; }
    .rule-dropdown[open] summary::after { transform: rotate(180deg); color: var(--cdl-purple); }
    .rule-body { padding: 12px 18px 16px 18px; color: var(--text-muted); font-size: 14.5px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    #rules-closing { margin-top: 35px; padding-top: 15px; text-align: center; font-weight: 700; color: var(--neon-amber); border-top: 1px dashed rgba(255, 255, 255, 0.1); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #0f172a; border: 1px solid var(--cdl-cyan); border-radius: 16px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 28px; position: relative; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); text-align: left; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--cdl-cyan); margin-bottom: 6px; }
    .form-control { width: 100%; background: #1e293b; border: 1px solid var(--card-border); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 14px; }

    .btn-primary { background: var(--cdl-cyan); color: #000; font-weight: 700; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
    .btn-sec { background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: var(--text-main); font-weight: 700; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-danger { background: #ef4444; color: #fff; font-weight: 700; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin-left: 10px; }

    .action-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-main); font-weight: 700; font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer; display: none; }
    .body-unlocked .action-btn { display: inline-block; }

    .social-bar { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
    .social-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; font-weight: 700; font-size: 13px; }
    .social-btn:hover { background: var(--cdl-cyan); color: #000; }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
 <!-- Centralized Navigation Bar -->
<nav id="pos-nav"></nav>
<script src="nav.js"></script>

  <div class="container">

    <!-- Hero Header -->
    <header class="glass-card hero-header">
      <div class="logo-container-relative">
        <img src="P-OS.png" id="hub-logo-img" alt="POS Logo" class="hub-logo-img">
        <button class="edit-pencil" onclick="editHeroHeader()" style="position:absolute; bottom:0; right:-5px;">✏️</button>
      </div>
      <div class="title-area">
        <h1><span id="hero-title">prism outreach studio</span> <button class="edit-pencil" onclick="editHeroHeader()">✏️</button></h1>
        <p style="font-size: 14px; color: var(--text-muted);" id="hub-subtitle">
          plateforme des activités, échanges linguistiques et projets artistiques à rennes
        </p>
      </div>
    </header>

    <!-- Initiatives Section -->
    <section class="glass-card">
      <div class="section-title">
        <span>✨ <span id="title-events">nos initiatives</span></span>
        <div>
          <button class="action-btn" onclick="addNewInitiative()">➕ ajouter une initiative</button>
          <button class="action-btn" onclick="exportJSON()">📥 exporter JSON</button>
        </div>
      </div>
      
      <div class="events-gallery" id="events-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Calendar Section -->
    <section class="glass-card">
      <div id="pos-calendar"></div>
    </section>
    <script src="calendar.js"></script>

    <!-- Community Rules Section -->
    <section class="glass-card">
      <div class="section-title">
        <span>📜 <span id="title-rules">règlement intérieur général (pos)</span></span>
        <button class="edit-pencil" onclick="openIndexRulesManagerModal()">✏️</button>
      </div>
      
      <div id="index-rules-container">
        <!-- Dynamic Rules Rendered Here -->
      </div>

      <p id="rules-closing">
        💫 on est ravis de vous compter parmi nous ! à très bientôt dans nos événements !
      </p>
    </section>

    <!-- Footer -->
    <footer style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 30px;">
      <div class="social-bar">
        <a href="https://www.facebook.com/profile.php?id=100090407626653" class="social-btn" target="_blank">FB</a>
        <a href="https://www.instagram.com/rennescafedeslangues/" class="social-btn" target="_blank">IG</a>
        <a href="https://www.instagram.com/rennes.englishchoir/" class="social-btn" target="_blank">🎤</a>
      </div>
    </footer>

  </div>

  <!-- General Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body-container"></div>
    </div>
  </div>

  <script>
    const TRAINER_PIN_HASH = "c9693df0c3bd56a2c6b9bebbb0e51210e771823498faec23398581961e8aa3d2";
    let isUnlocked = false;
    let undoHistoryStack = [];

    async function sha256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function pushUndoAction(actionObj) {
      undoHistoryStack.push(actionObj);
      updateUndoButtonVisibility();
    }

    function updateUndoButtonVisibility() {
      const btn = document.getElementById('undo-global-btn');
      if (btn) btn.style.display = (isUnlocked && undoHistoryStack.length > 0) ? 'inline-block' : 'none';
    }

    function executeGlobalUndo() {
      if (undoHistoryStack.length === 0) return;
      const lastAction = undoHistoryStack.pop();

      if (lastAction.type === 'initiatives') {
        eventsData = lastAction.previousData;
        localStorage.setItem('pos_events_data', JSON.stringify(eventsData));
        renderEvents();
      } else if (lastAction.type === 'heroHeader') {
        document.getElementById('hub-logo-img').src = lastAction.previousImg;
        document.getElementById('hero-title').innerText = lastAction.previousTitle;
        document.getElementById('hub-subtitle').innerText = lastAction.previousSub;
        localStorage.setItem('pos_hero_logo', lastAction.previousImg);
        localStorage.setItem('pos_hero_title', lastAction.previousTitle);
        localStorage.setItem('pos_hero_subtitle', lastAction.previousSub);
      } else if (lastAction.type === 'rules') {
        indexRulesData = lastAction.previousRules;
        indexRulesClosing = lastAction.previousClosing;
        localStorage.setItem('pos_index_rules', JSON.stringify(indexRulesData));
        localStorage.setItem('pos_index_rules_closing', indexRulesClosing);
        renderIndexRules();
      }

      updateUndoButtonVisibility();
    }

    function setGlobalUnlockState(state) {
      isUnlocked = state;
      if (state) {
        document.body.classList.add('body-unlocked');
        document.getElementById('lock-btn').classList.add('unlocked');
        document.getElementById('lock-text').innerText = "déverrouillé";
      } else {
        document.body.classList.remove('body-unlocked');
        document.getElementById('lock-btn').classList.remove('unlocked');
        document.getElementById('lock-text').innerText = "verrouillé";
      }
      updateUndoButtonVisibility();
      renderEvents();
    }

    async function toggleLock() {
      if (!isUnlocked) {
        const pin = prompt("Entrez le code PIN formateur pour modifier :");
        if (pin !== null) {
          const inputHash = await sha256(pin);
          if (inputHash === TRAINER_PIN_HASH) {
            setGlobalUnlockState(true);
          } else {
            alert("Code PIN incorrect.");
          }
        }
      } else {
        setGlobalUnlockState(false);
      }
    }

    const defaultEvents = [
      { id: "cdl", image: "hermine-futuristic.png", tag: "échanges linguistiques", title: "rennes café des langues", desc: "rencontres hebdomadaires gratuites pour pratiquer plus de 53 langues, échanger et faire de belles rencontres sans cours magistraux.", details: "nos événements ont lieu tous les mercredis soir de 19h à 22h dans nos bars partenaires à rennes. ouvert à tous les niveaux.", url: "cdl-code.html" },
      { id: "choir", image: "choir.png", tag: "chorale & musique", title: "rennes english choir", desc: "ensemble vocal anglophone dirigé par un chef natif. chantez des morceaux stimulants, travaillez votre prononciation et soutenez des causes caritatives.", details: "répétitions régulières et concerts engagés. 50% de la billetterie est reversée à des associations d'aide aux victimes de violences.", url: "rec-code.html" }
    ];

    let eventsData = JSON.parse(localStorage.getItem('pos_events_data')) || defaultEvents;

    /* Dynamic Nav Renderer */
    function renderDynamicNav() {
      const navContainer = document.getElementById('dynamic-nav-container');
      if (!navContainer) return;
      navContainer.innerHTML = '';

      if (eventsData.length > 3) {
        let dropdownItems = eventsData.map(item => `
          <a href="${item.url}" class="nav-dropdown-item">${item.title}</a>
        `).join('');

        navContainer.innerHTML = `
          <div class="nav-dropdown">
            <a href="index.html" class="nav-tab active">tous les événements ▼</a>
            <div class="nav-dropdown-content">
              ${dropdownItems}
            </div>
          </div>
        `;
      } else {
        let navTabs = `<a href="index.html" class="nav-tab active" id="nav-hub">tous les événements</a>`;
        eventsData.forEach(item => {
          navTabs += `<a href="${item.url}" class="nav-tab">${item.title}</a>`;
        });
        navContainer.innerHTML = navTabs;
      }
    }

    function renderEvents() {
      const container = document.getElementById('events-container');
      if (!container) return;
      container.innerHTML = '';

      eventsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'notion-event-card';
        card.onclick = () => openEventModal(index);

        card.innerHTML = `
          <div class="card-cover">
            <img src="${item.image}" alt="${item.title}" class="card-cover-img" onerror="this.style.display='none'">
          </div>
          <div class="card-body">
            <span class="card-tag">${item.tag}</span>
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
        `;
        container.appendChild(card);
      });

      renderDynamicNav();
    }

    function openEventModal(index) {
      const item = eventsData[index];
      const container = document.getElementById('modal-body-container');

      if (isUnlocked) {
        container.innerHTML = `
          <h2 style="color: var(--neon-amber); margin-bottom: 20px;">✏️ modifier l'initiative</h2>
          <div class="form-group">
            <label>Fichier Image Cover (ex: hermine-futuristic.png) :</label>
            <input type="text" id="edit-image" class="form-control" value="${item.image || ''}">
          </div>
          <div class="form-group">
            <label>Catégorie / Tag :</label>
            <input type="text" id="edit-tag" class="form-control" value="${item.tag}">
          </div>
          <div class="form-group">
            <label>Titre de l'initiative :</label>
            <input type="text" id="edit-title" class="form-control" value="${item.title}">
          </div>
          <div class="form-group">
            <label>Description courte (carte) :</label>
            <textarea id="edit-desc" class="form-control" rows="2">${item.desc}</textarea>
          </div>
          <div class="form-group">
            <label>Description détaillée (popup) :</label>
            <textarea id="edit-details" class="form-control" rows="4">${item.details}</textarea>
          </div>
          <div class="form-group">
            <label>Page URL (ex: cdl-code.html ou nouvelle-page.html) :</label>
            <input type="text" id="edit-url" class="form-control" value="${item.url}">
          </div>
          <div style="margin-top: 20px;">
            <button class="btn-primary" onclick="saveEvent(${index})">💾 enregistrer</button>
            <button class="btn-danger" onclick="deleteEvent(${index})">🗑️ supprimer</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div style="width: 100%; height: 180px; overflow: hidden; border-radius: 10px; margin-bottom: 15px;">
            <img src="${item.image}" alt="${item.title}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
          </div>
          <span style="display:inline-block; font-weight:700; font-size:12px; color:var(--cdl-cyan); margin-bottom:10px;">${item.tag}</span>
          <h2 style="color: var(--cdl-cyan); margin-bottom: 15px;">${item.title}</h2>
          <p style="line-height: 1.6; color: var(--text-main); margin-bottom: 20px;">${item.details}</p>
          <a href="${item.url}" class="btn-primary" style="display:inline-block; text-decoration:none; text-align:center;">voir la page de l'initiative ↗</a>
        `;
      }

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function saveEvent(index) {
      pushUndoAction({ type: 'initiatives', previousData: JSON.parse(JSON.stringify(eventsData)) });

      eventsData[index].image = document.getElementById('edit-image').value;
      eventsData[index].tag = document.getElementById('edit-tag').value;
      eventsData[index].title = document.getElementById('edit-title').value;
      eventsData[index].desc = document.getElementById('edit-desc').value;
      eventsData[index].details = document.getElementById('edit-details').value;
      eventsData[index].url = document.getElementById('edit-url').value;

      localStorage.setItem('pos_events_data', JSON.stringify(eventsData));
      renderEvents();
      closeModal();
    }

    function addNewInitiative() {
      pushUndoAction({ type: 'initiatives', previousData: JSON.parse(JSON.stringify(eventsData)) });

      const newId = "initiative-" + Date.now();
      eventsData.push({
        id: newId,
        image: "P-OS.png",
        tag: "nouvelle initiative",
        title: "titre de la nouvelle initiative",
        desc: "description courte...",
        details: "description détaillée...",
        url: "rec-code.html"
      });

      localStorage.setItem('pos_events_data', JSON.stringify(eventsData));
      renderEvents();
      openEventModal(eventsData.length - 1);
    }

    function deleteEvent(index) {
      if (confirm("Voulez-vous vraiment supprimer cette initiative ?")) {
        pushUndoAction({ type: 'initiatives', previousData: JSON.parse(JSON.stringify(eventsData)) });
        eventsData.splice(index, 1);
        localStorage.setItem('pos_events_data', JSON.stringify(eventsData));
        renderEvents();
        closeModal();
      }
    }

    function editHeroHeader() {
      const currentImg = document.getElementById('hub-logo-img').getAttribute('src');
      const currentTitle = document.getElementById('hero-title').innerText;
      const currentSub = document.getElementById('hub-subtitle').innerText;

      const container = document.getElementById('modal-body-container');
      container.innerHTML = `
        <h3 style="color:var(--cdl-cyan); margin-bottom:15px;">✏️ modifier l'en-tête & logo POS</h3>
        <div class="form-group">
          <label>Fichier Logo / Image (ex: P-OS.png) :</label>
          <input type="text" id="edit-hero-img-in" class="form-control" value="${currentImg}">
        </div>
        <div class="form-group">
          <label>Titre principal :</label>
          <input type="text" id="edit-hero-title-in" class="form-control" value="${currentTitle}">
        </div>
        <div class="form-group">
          <label>Sous-titre :</label>
          <input type="text" id="edit-hero-sub-in" class="form-control" value="${currentSub}">
        </div>
        <button class="btn-primary" onclick="saveHeroHeader()">💾 enregistrer</button>
      `;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function saveHeroHeader() {
      const img = document.getElementById('edit-hero-img-in').value;
      const t = document.getElementById('edit-hero-title-in').value;
      const s = document.getElementById('edit-hero-sub-in').value;

      pushUndoAction({
        type: 'heroHeader',
        previousImg: document.getElementById('hub-logo-img').getAttribute('src'),
        previousTitle: document.getElementById('hero-title').innerText,
        previousSub: document.getElementById('hub-subtitle').innerText
      });

      document.getElementById('hub-logo-img').src = img;
      document.getElementById('hero-title').innerText = t;
      document.getElementById('hub-subtitle').innerText = s;

      localStorage.setItem('pos_hero_logo', img);
      localStorage.setItem('pos_hero_title', t);
      localStorage.setItem('pos_hero_subtitle', s);
      closeModal();
    }

    /* --- Dynamic Index Rules System --- */
    const defaultIndexRules = [
      { title: "cadre et objectifs", body: "toutes les initiatives du prism outreach studio (pos) visent à créer un environnement accueillant, solidaire et inclusif à rennes et au-delà. nos activités permettent de pratiquer des langues, partager des arts et renforcer la confiance en soi. ces règles s'appliquent à l'ensemble des événements organisés par l'association." },
      { title: "respect des lieux et partenaires", body: "nos activités se déroulent dans divers établissements partenaires qui nous accueillent. afin de les remercier, le soutien local (consommation sur place) est vivement encouragé. tout état d'ivresse manifeste ou comportement irrespectueux envers les lieux et le personnel est strictly interdit." },
      { title: "environnement sûr et inclusif", body: "conformément à l'article 21 de nos statuts, nous promouvons l'inclusion et la diversité. zéro harcèlement : nos événements sont des espaces d'apprentissage et de partage, pas des lieux de séduction. les avances romantiques ou sexuelles non sollicitées ne sont pas tolérées." },
      { title: "vie privée et communications", body: "respect de la vie privée : il est interdit de contacter directement les membres (dm) sans leur permission préalable. les échanges doivent rester publics et respectueux au sein des canaux de groupe officiels." },
      { title: "activités commerciales et publicité", body: "l'association est à but non lucratif. aucune publicité, démarchage ou vente de services commerciaux (cours privés, offres professionnelles) n'est autorisée au sein de nos événements ou groupes de discussion." },
      { title: "sanctions et modération", body: "le respect de ce règlement est indispensable pour maintenir l'esprit communautaire. l'association se réserve le droit d'exclure toute personne d'un événement ou du groupe en cas de comportement nuisible. contact et signalements : rennescafedeslangues@gmail.com." }
    ];

    let indexRulesData = JSON.parse(localStorage.getItem('pos_index_rules')) || defaultIndexRules;
    let indexRulesClosing = localStorage.getItem('pos_index_rules_closing') || "💫 on est ravis de vous compter parmi nous ! à très bientôt dans nos événements !";

    function renderIndexRules() {
      const container = document.getElementById('index-rules-container');
      if (!container) return;
      container.innerHTML = '';

      indexRulesData.forEach((rule, idx) => {
        const details = document.createElement('details');
        details.className = 'rule-dropdown';
        details.innerHTML = `
          <summary>${idx + 1}. <span>${rule.title}</span></summary>
          <div class="rule-body">${rule.body}</div>
        `;
        container.appendChild(details);
      });

      document.getElementById('rules-closing').innerText = indexRulesClosing;
    }

    function openIndexRulesManagerModal() {
      const container = document.getElementById('modal-body-container');
      container.innerHTML = `
        <h3 style="color:var(--cdl-cyan); margin-bottom:15px;">✏️ gérer le règlement intérieur (pos)</h3>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px;">Modifiez, ajoutez ou supprimez les règles générales de l'association :</p>
        <div id="rules-form-list">
          ${indexRulesData.map((r, i) => `
            <div style="background:#1e293b; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid var(--card-border);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <strong style="color:var(--cdl-cyan);">Règle #${i + 1}</strong>
                <button onclick="removeIndexRuleFromForm(${i})" class="btn-danger" style="padding:2px 8px; font-size:11px;">🗑️ supprimer</button>
              </div>
              <input type="text" id="index-rule-title-${i}" class="form-control" value="${r.title}" style="margin-bottom:6px;">
              <textarea id="index-rule-body-${i}" class="form-control" rows="2">${r.body}</textarea>
            </div>
          `).join('')}
        </div>
        <button onclick="addIndexRuleToForm()" class="btn-sec" style="width:100%; margin-bottom:15px;">➕ ajouter une règle</button>
        <div class="form-group">
          <label>Texte de conclusion ("On est ravis...") :</label>
          <input type="text" id="index-rule-closing-input" class="form-control" value="${indexRulesClosing}">
        </div>
        <button onclick="saveAllIndexRules()" class="btn-primary" style="width:100%; margin-top:10px;">💾 enregistrer le règlement</button>
      `;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function addIndexRuleToForm() {
      indexRulesData.push({ title: "nouvelle règle", body: "description de la règle..." });
      openIndexRulesManagerModal();
    }

    function removeIndexRuleFromForm(i) {
      indexRulesData.splice(i, 1);
      openIndexRulesManagerModal();
    }

    function saveAllIndexRules() {
      pushUndoAction({
        type: 'rules',
        previousRules: JSON.parse(JSON.stringify(indexRulesData)),
        previousClosing: indexRulesClosing
      });

      indexRulesData.forEach((r, i) => {
        const tEl = document.getElementById(`index-rule-title-${i}`);
        const bEl = document.getElementById(`index-rule-body-${i}`);
        if (tEl && bEl) {
          r.title = tEl.value;
          r.body = bEl.value;
        }
      });

      const closingInput = document.getElementById('index-rule-closing-input');
      if (closingInput) indexRulesClosing = closingInput.value;

      localStorage.setItem('pos_index_rules', JSON.stringify(indexRulesData));
      localStorage.setItem('pos_index_rules_closing', indexRulesClosing);
      renderIndexRules();
      closeModal();
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(eventsData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "pos_initiatives_data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    const i18n = {
      fr: {
        navHub: "tous les événements", navCdl: "café des langues", navChoir: "rennes english choir",
        navJoin: "rejoins-nous !",
        hubSubtitle: "plateforme des activités, échanges linguistiques et projets artistiques à rennes",
        titleEvents: "nos initiatives", rulesTitle: "règlement intérieur général (pos)"
      },
      en: {
        navHub: "all events", navCdl: "café des langues", navChoir: "rennes english choir",
        navJoin: "join us!",
        hubSubtitle: "community hub for language exchanges, vocal music, and cultural projects in rennes",
        titleEvents: "our initiatives", rulesTitle: "general community guidelines (pos)"
      }
    };

    function setLanguage(lang) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');

      const dict = i18n[lang];
      if (document.getElementById('nav-hub')) document.getElementById('nav-hub').innerText = dict.navHub;

      if (document.getElementById('join-btn-text')) {
        document.getElementById('join-btn-text').innerText = dict.navJoin;
      }

      document.getElementById('hub-subtitle').innerText = dict.hubSubtitle;
      document.getElementById('title-events').innerText = dict.titleEvents;
      document.getElementById('title-rules').innerText = dict.rulesTitle;

      if (typeof window.syncCalendarLanguage === "function") {
        window.syncCalendarLanguage(lang);
      }
    }

    window.onload = function() {
      const savedLogo = localStorage.getItem('pos_hero_logo');
      if (savedLogo) document.getElementById('hub-logo-img').src = savedLogo;

      const savedTitle = localStorage.getItem('pos_hero_title');
      if (savedTitle) document.getElementById('hero-title').innerText = savedTitle;

      const savedSub = localStorage.getItem('pos_hero_subtitle');
      if (savedSub) document.getElementById('hub-subtitle').innerText = savedSub;

      renderEvents();
      renderIndexRules();
    };
  </script>
</body>
</html>
